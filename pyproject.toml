[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.1.0"
description = "Локальний фоновий голосовий асистент для Windows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pynput>=1.7",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "google-genai>=1.0",
    "pywin32>=306",
    "pyperclip>=1.8",
    "winotify>=1.1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0", "av<19"]
telegram = ["telethon>=1.36"]
gesture = ["mediapipe>=1.1.0", "opencv-python-headless>=4.10"]
launcher = ["PySide6>=6.7", "tomli-w>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
