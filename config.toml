[hotkeys]
voice = "right_ctrl"          # утримувати для голосової команди
explain_clipboard = "ctrl+alt+d"   # помилка з буфера -> документація
gesture = "ctrl+tab"          # натиснути для вмикання/вимикання режиму жестів (toggle)
cancel = "esc"

[audio]
sample_rate = 16000
max_seconds = 15
tail_ms = 200                 # дописати після відпускання клавіші

[stt]
backend = "gemini"            # "gemini" | "whisper_local"
language = "uk"
model = "gemini-3.5-flash-lite"
timeout_s = 20.0

[llm]
backend = "gemini"              # "gemini" | "clef"
model = "gemini-3.5-flash-lite"
clef_model = "clef"
clef_base_url = "https://api.experientiallabs.ai/v1"

[tts]
enabled = true
engine = "edge"               # "edge" | "kokoro" | "off"
voice = "en-US-AriaNeural"    # English female voice
voice_uk = "uk-UA-PolinaNeural" # Ukrainian female voice
speed = 1.0
sample_rate = 24000
kokoro_model_path = "C:/Users/Acer/Jarvis/kokoro-v1.0.onnx"
kokoro_voices_path = "C:/Users/Acer/Jarvis/voices-v1.0.bin"
kokoro_voice = "af_heart"     # Kokoro fallback voice

[monitors]
primary = 0
docs = 1                      # на який монітор відкривати документацію

[apps]                        # білий список: назва -> команда
code = "code"
telegram = "C:\\Users\\Acer\\AppData\\Roaming\\Telegram Desktop\\Telegram.exe"
browser = "chrome"

[docs_sites]                  # для пошуку документації за бібліотекою
python = "docs.python.org"
fastapi = "fastapi.tiangolo.com"
pydantic = "docs.pydantic.dev"
mdn = "developer.mozilla.org"

[agent]
command = "antigravity"       # перевірити реальний синтаксис: antigravity --help
auto_approve = false          # ЗАВЖДИ false при голосовому керуванні

[gesture]
enabled = true
mode = "drag"                 # "drag" | "swipe"
camera_index = 0
fps = 20
pinch_on = 0.28               # поріг увімкнення щипка (гістерезис)
pinch_off = 0.40              # поріг відпускання щипка
hold_ms = 150                 # мінімальна тривалість щипка для старту перетягування
swipe_distance = 0.22         # мін. зміщення за X для swipe (< 1 с)
mirror = true                 # дзеркальне відображення осі X камери
idle_timeout_s = 10.0         # авто-вимкнення камери при бездіяльності

[bridge]
enabled = true
friday_host = "127.0.0.1"
friday_port = 8766
jarvis_url = "http://127.0.0.1:8765"
jarvis_voice = "en-US-ChristopherNeural"
timeout_s = 45.0


